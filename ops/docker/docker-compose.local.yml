services:
  postgres:
    image: postgres:16-alpine
    container_name: wanderson-postgres
    env_file:
      - ../../.env.local
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER}
      POSTGRES_PASSWORD: REDACTED
      POSTGRES_DB: ${LOCAL_POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wanderson-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --save ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: wanderson-minio
    env_file:
      - ../../.env.local
    environment:
      MINIO_ROOT_USER: ${LOCAL_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${LOCAL_MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc
    container_name: wanderson-minio-init
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - ../../.env.local
    entrypoint: /bin/sh
    command: >
      -c "
      mc alias set local http://minio:9000 ${LOCAL_MINIO_ROOT_USER} ${LOCAL_MINIO_ROOT_PASSWORD};
      mc mb -p local/sgs-local 2>/dev/null || true;
      mc anonymous set none local/sgs-local 2>/dev/null || true;
      exit 0;
      "
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
  redis_data:
  minio_data:
