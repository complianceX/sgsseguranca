[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = [
  "backend/**",
  "Dockerfile",
  "railway.web.toml"
]

[deploy]
startCommand = "node dist/main.js"
healthcheckPath = "/health/public"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 30
drainingSeconds = 30
